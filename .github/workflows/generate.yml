name: Generate WeChat Article

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read
  actions: write

concurrency:
  group: wechat-article-generation
  cancel-in-progress: false

jobs:
  select-topic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      agent_run_id: ${{ steps.candidate.outputs.agent_run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install publisher
        run: pip install -e .

      - name: Validate generation secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Select and verify topic
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          wechat-ai-publisher \
            --config config/account.ci.yaml \
            agent run \
            --draft-only > "$RUNNER_TEMP/topic-selection.json"

      - name: Validate topic candidate
        id: candidate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          states = sorted(Path("runtime").glob("agent-*/agent-state.json"))
          if len(states) != 1:
              raise SystemExit(f"必须恰好生成一个 Agent 状态，实际为 {len(states)}")
          state = json.loads(states[0].read_text(encoding="utf-8"))
          if state["status"] != "awaiting_approval":
              raise SystemExit(f"Agent 未进入选题待确认状态：{state['status']}")
          approval_path = Path(state["outputs"]["topic_approval"])
          approval = json.loads(approval_path.read_text(encoding="utf-8"))
          lines = [
              "## 待确认选题",
              "",
              f"- Agent 任务：`agent-{state['run_id']}`",
              f"- 标题：**{approval['title']}**",
              f"- 分类：{approval['category']}",
              f"- 目标读者：{approval['target_reader']}",
              f"- 读者问题：{approval['reader_problem']}",
              f"- 核心结论：{approval['core_conclusion']}",
              f"- 可复制资产：{approval['reusable_asset']}",
              f"- 官方来源：[{approval['source']['title']}]({approval['source']['url']})",
              "",
              "请在 `topic-approval` Environment 中批准后继续生成文章。",
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"agent_run_id={state['run_id']}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload topic candidate
        uses: actions/upload-artifact@v4
        with:
          name: topic-candidate-${{ github.run_id }}
          path: runtime/
          if-no-files-found: error
          retention-days: 14

  continue-generation:
    needs: select-topic
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: topic-approval
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install publisher
        run: pip install -e .

      - name: Install Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fonts-noto-cjk

      - name: Download approved topic candidate
        uses: actions/download-artifact@v4
        with:
          # upload path 是 runtime/ 时，artifact 根目录是其内容（agent-*/），需还原到 runtime/
          name: topic-candidate-${{ github.run_id }}
          path: runtime

      - name: Verify restored Agent task
        env:
          AGENT_RUN_ID: ${{ needs.select-topic.outputs.agent_run_id }}
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          run_id = os.environ["AGENT_RUN_ID"]
          expected = Path("runtime") / f"agent-{run_id}"
          state_path = expected / "agent-state.json"
          candidates = [
              Path("agent-" + run_id),
              Path("runtime") / "runtime" / f"agent-{run_id}",
          ]
          if not state_path.is_file():
              for candidate in candidates:
                  if (candidate / "agent-state.json").is_file():
                      expected.parent.mkdir(parents=True, exist_ok=True)
                      if expected.exists():
                          shutil.rmtree(expected)
                      shutil.move(str(candidate), str(expected))
                      break
          if not state_path.is_file():
              listing = sorted(str(path) for path in Path(".").rglob("agent-state.json"))[:20]
              raise SystemExit(
                  "恢复选题任务失败："
                  f"缺少 {state_path}；找到的 agent-state.json：{listing or ['<none>']}"
              )
          print(f"restored {state_path}")
          PY

      - name: Record topic approval
        run: |
          wechat-ai-publisher \
            --config config/account.ci.yaml \
            agent approve-topic \
            --run-id "${{ needs.select-topic.outputs.agent_run_id }}" \
            --actor "${{ github.actor }}" \
            --note "Approved through GitHub Environment topic-approval"

      - name: Generate reviewed article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          wechat-ai-publisher \
            --config config/account.ci.yaml \
            agent resume \
            --run-id "${{ needs.select-topic.outputs.agent_run_id }}"

      - name: Write generation summary
        if: always()
        env:
          AGENT_RUN_ID: ${{ needs.select-topic.outputs.agent_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["AGENT_RUN_ID"]
          state_path = Path("runtime") / f"agent-{run_id}" / "agent-state.json"
          lines = [
              "## 微信文章生成结果",
              "",
              f"- Agent 任务：`agent-{run_id}`",
          ]
          if not state_path.is_file():
              lines.append(f"- 错误：缺少状态文件 `{state_path}`，选题 artifact 可能未正确恢复")
          else:
              state = json.loads(state_path.read_text(encoding="utf-8"))
              lines.extend([
                  f"- 状态：`{state['status']}`",
                  f"- 选题确认人：{state.get('topic_approval_actor') or '-'}",
              ])
              if state["status"] == "completed":
                  lines.extend([
                      f"- HTML：`{state['outputs']['draft_html']}`",
                      f"- 质量门禁：`{state['outputs']['quality_gate']}`",
                      f"- 视觉审查：`{state['outputs']['visual_review']}`",
                  ])
              else:
                  lines.append(f"- 错误：{state.get('error') or '文章未完成'}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload article bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-agent-${{ github.run_id }}
          path: |
            runtime/
            articles/drafts/
          if-no-files-found: warn
          retention-days: 14
