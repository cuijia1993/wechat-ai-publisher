name: Publish WeChat Draft

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Generate WeChat Article 工作流的 GitHub run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: wechat-draft-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, wechat-publisher]
    timeout-minutes: 20
    environment: wechat-draft
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install publisher
        run: pip install -e .

      - name: Download reviewed article bundle
        uses: actions/download-artifact@v4
        with:
          name: content-agent-${{ inputs.source_run_id }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Validate publishable bundle
        id: bundle
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path.cwd().resolve()
          manifests = []
          for path in Path("runtime").glob("agent-*/manifest.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("status") == "ready_to_publish":
                  manifests.append((path, data))
          if len(manifests) != 1:
              raise SystemExit(
                  f"Artifact 必须恰好包含一个 ready_to_publish 任务，实际为 {len(manifests)}"
              )
          _, manifest = manifests[0]
          for name in ("edited", "quality_gate", "visual_manifest", "cover"):
              value = manifest["outputs"].get(name)
              if not value or Path(value).is_absolute():
                  raise SystemExit(f"任务输出 {name} 不是可移植相对路径")
              resolved = (root / value).resolve()
              if not resolved.is_relative_to(root) or not resolved.is_file():
                  raise SystemExit(f"任务输出 {name} 不存在或越界：{value}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"job_id={manifest['job_id']}\n")
          PY

      - name: Validate WeChat secrets
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
        run: test -n "$WECHAT_APP_ID" && test -n "$WECHAT_APP_SECRET"

      - name: Create WeChat draft
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
        run: |
          wechat-ai-publisher \
            --config config/account.publish.yaml \
            publish \
            --job "${{ steps.bundle.outputs.job_id }}" \
            --approved > "$RUNNER_TEMP/wechat-publish-output.json"

      - name: Create sanitized publish receipt
        env:
          JOB_ID: ${{ steps.bundle.outputs.job_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          job_id = os.environ["JOB_ID"]
          source = Path("runtime") / job_id / "publish-result.json"
          result = json.loads(source.read_text(encoding="utf-8"))
          receipt = {
              "job_id": job_id,
              "status": result["status"],
              "dry_run": result["dry_run"],
              "recorded_at": datetime.now(UTC).isoformat(),
          }
          output = source.with_name("publish-receipt.json")
          output.write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Upload publish receipt
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wechat-publish-${{ github.run_id }}
          path: runtime/${{ steps.bundle.outputs.job_id }}/publish-receipt.json
          if-no-files-found: error
          retention-days: 7
