[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-ai-publisher"
version = "0.1.0"
description = "智效进化社微信公众号 AI 内容生产与草稿发布流水线"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "markdown>=3.7",
  "openai>=1.50",
  "Pillow>=11.0",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[project.scripts]
wechat-ai-publisher = "wechat_ai_publisher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

