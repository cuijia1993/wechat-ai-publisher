  - id: ai-life-privacy
    title: 把孩子照片和家庭信息发给 AI 前，先想清楚这些隐私风险
    category: 隐私与家庭安全
    target_reader: 会用 AI 处理照片、旅行、消费和家庭事务的普通用户
    reader_problem: 为了获得更准确建议，用户可能无意上传孩子照片、身份、位置和家庭成员信息。
    core_conclusion: 先做数据最小化和脱敏，再让 AI 处理低风险规划任务。
    required_evidence:
      - 公开平台隐私说明
