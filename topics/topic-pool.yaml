  - id: ai-resume-fact-check
    title: AI 写简历把经历优化过头，面试时谁来圆
    primary_search_keyword: AI 写简历
    category: 工作与收入
    target_reader: 使用 AI 修改简历的求职者
    reader_problem: AI 可能把模糊经历补成无法证明的职责、技能和数字。
    core_conclusion: AI 可以整理和匹配真实经历，但所有新增事实都必须删除或人工确认。
    required_evidence:
