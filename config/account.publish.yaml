account:
  name: 智效进化论
  author: 智效进化论
  default_digest: 关注 AI 如何影响普通人的工作、钱包、安全、健康与家庭，提供看得懂、用得上的判断和避坑清单。

model:
  model: qwen3.7-max-2026-05-17
  model_env: OPENAI_MODEL
  base_url: https://llm-q5islkwwval2g1sf.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  base_url_env: OPENAI_BASE_URL
  api_key_env: OPENAI_API_KEY
  temperature: 0.3
  max_retries: 3

content:
  topic_file: topics/topic-pool.yaml
  style_guide: config/style-guide.md
  prompt_dir: config/prompts
  output_dir: runtime

discovery:
  sources_file: config/sources.yaml

agent:
  max_steps: 40
  max_revisions: 2
  stage_timeout_seconds: 180
  draft_only: true
  require_topic_approval: true

render:
  theme_file: config/themes/professional-minimal.yaml
  generated_assets_dir: assets/generated
  image:
    provider: disabled

quality:
  require_sources: true
  require_verification_for_claims: true
  editorial_min_score: 8.0
  visual_min_score: 8.0
  forbidden_terms:
    - 公司内部
    - 生产环境
    - 绝对领先
    - 百分之百
  internal_patterns:
    - "\\b(?:10|127)\\.\\d+\\.\\d+\\.\\d+\\b"
    - "https?://[^\\s/]+\\.(?:internal|local)\\b"

publish:
  mode: wechat_draft
  dry_run: false
  require_human_approval: true
  auto_publish_after_approval: false
  app_id_env: WECHAT_APP_ID
  app_secret_env: WECHAT_APP_SECRET
